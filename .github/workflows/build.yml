name: Build and push images

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.aria2"
      - "Dockerfile.ariang"
      - ".github/workflows/build.yml"
      - ".versions.json"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-aria2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.aria2
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/aria2:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/aria2:${{ github.sha }}

  build-ariang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Ariang Version
        run: echo "ARIANG_VERSION=$(jq -r .ariang .versions.json)" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ariang
          build-args: |
            ARIANG_VERSION=${{ env.ARIANG_VERSION }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ariang:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ariang:${{ github.sha }}
