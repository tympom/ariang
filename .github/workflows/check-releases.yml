name: Check Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update Versions
        run: |
          ARIANG=$(curl -s https://api.github.com/repos/mayswind/AriaNg/releases/latest | jq -r .tag_name)
          ARIA2=$(curl -s https://api.github.com/repos/aria2/aria2/releases/latest | jq -r .tag_name | sed 's/v//')
          
          echo "{\"ariang\": \"$ARIANG\", \"aria2\": \"$ARIA2\"}" > .versions.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .versions.json
          git commit -m "chore: update versions" || echo "No changes to commit"
          git push
