name: Check Releases

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Latest Versions
        id: fetch
        run: |
          ARIANG_LATEST=$(curl -s https://api.github.com/repos/mayswind/AriaNg/releases/latest | jq -r .tag_name)
          ARIA2_LATEST=$(curl -s https://api.github.com/repos/aria2/aria2/releases/latest | jq -r .tag_name | sed 's/v//')
          echo "ariang=$ARIANG_LATEST" >> $GITHUB_OUTPUT
          echo "aria2=$ARIA2_LATEST" >> $GITHUB_OUTPUT

      - name: Compare Versions
        id: compare
        env:
          ARIANG_LATEST: ${{ steps.fetch.outputs.ariang }}
          ARIA2_LATEST: ${{ steps.fetch.outputs.aria2 }}
        run: |
          CURRENT_ARIANG=$(jq -r .ariang .versions.json)
          CURRENT_ARIA2=$(jq -r .aria2 .versions.json)
          
          NEW_FOUND=false
          MSG=""
          
          if [ "$ARIANG_LATEST" != "$CURRENT_ARIANG" ]; then
            MSG="$MSG- Ariang: $CURRENT_ARIANG $\rightarrow$ $ARIANG_LATEST\n"
            NEW_FOUND=true
          fi
          
          if [ "$ARIA2_LATEST" != "$CURRENT_ARIA2" ]; then
            MSG="$MSG- Aria2: $CURRENT_ARIA2 $\rightarrow$ $ARIA2_LATEST\n"
            NEW_FOUND=true
          fi
          
          echo "new_found=$NEW_FOUND" >> $GITHUB_OUTPUT
          echo "message=$(echo -e $MSG)" >> $GITHUB_OUTPUT

      - name: Create Issue
        if: steps.compare.outputs.new_found == 'true'
        run: |
          gh issue create \
            --title "🚀 New Releases Available" \
            --body "The following updates were detected:
            
            ${{ steps.compare.outputs.message }}
            
            These will be automatically picked up by the next build."

      - name: Update Versions File
        if: steps.compare.outputs.new_found == 'true'
        run: |
          jq ".ariang = \"${{ steps.fetch.outputs.ariang }}\" | .aria2 = \"${{ steps.fetch.outputs.aria2 }}\"" .versions.json > .versions.json.tmp && mv .versions.json.tmp .versions.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .versions.json
          git commit -m "chore: update monitored versions"
          git push
